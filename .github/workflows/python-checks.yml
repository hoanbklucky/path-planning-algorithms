name: Planner checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r simulators/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python simulators/path_planning_sim.py --check
